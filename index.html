<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>럭키드로우 — 추첨</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background-image: url("images/lucky_background.png");
      background-size: cover;        /* 화면 꽉 채움 */
      background-position: center;   /* 중앙 기준 */
      background-repeat: no-repeat;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      color: white;
    }

    .container {
      margin-top: 120px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(30px);
    }

    .title {
      font-size: 64px;
      font-weight: 800;
      margin-bottom: 40px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.25);
    }

    .digits-wrapper {
      background: transparent;
      padding: 48px 70px;
      border-radius: 42px;
      backdrop-filter: blur(14px);
      margin-bottom: 70px;
      display: inline-flex;
      gap: 30px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.28);
    }

    .digit-box {
      width: 115px;
      height: 160px;
      background: #0f1422;
      border-radius: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 86px;
      font-weight: 800;
      color: #00f6ff;
      text-shadow: 0 0 12px rgba(0,255,255,0.6), 0 0 22px rgba(0,255,255,0.45);
      box-shadow: inset 0 0 18px rgba(0,255,255,0.12);
    }
  </style>

</head>

<body>

<div class="container">
  <div class="digits-wrapper">
    <div class="digit-box" id="d1">0</div>
    <div class="digit-box" id="d2">0</div>
    <div class="digit-box" id="d3">0</div>
    <div class="digit-box" id="d4">0</div>
    <div class="digit-box" id="d5">0</div>
  </div>
</div>

<script>
  const digits = [
    document.getElementById("d1"),
    document.getElementById("d2"),
    document.getElementById("d3"),
    document.getElementById("d4"),
    document.getElementById("d5")
  ];

  // 참가자 번호 불러오기
  let numbers = JSON.parse(localStorage.getItem("luckydraw_numbers") || "[]");
  if (numbers.length === 0) {
    alert("업로드된 참가자 데이터가 없습니다.\n업로드 페이지로 이동합니다.");
    location.href = "upload.html";
  }

  function randomDigit() {
    return Math.floor(Math.random() * 10);
  }

  function playConfetti() {
    const defaults = { particleCount: 40, spread: 70, startVelocity: 26 };
    confetti({ ...defaults, origin: { x: 0.2, y: 0.15 } });
    confetti({ ...defaults, origin: { x: 0.5, y: 0.15 } });
    confetti({ ...defaults, origin: { x: 0.8, y: 0.15 } });
  }

  let isPlaying = false;

  function startDraw() {
    if (isPlaying) return;
    isPlaying = true;

    const index = Math.floor(Math.random() * numbers.length);
    const target = numbers[index];

    const spin = setInterval(() => {
      digits.forEach((d) => (d.textContent = randomDigit()));
    }, 80);

    setTimeout(() => {
      clearInterval(spin);

      [...target].forEach((n, i) => {
        digits[i].textContent = n;
      });

      numbers.splice(index, 1);
      localStorage.setItem("luckydraw_numbers", JSON.stringify(numbers));

      setTimeout(playConfetti, 300);
      isPlaying = false;
    }, 4000);
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") startDraw();
  });
</script>

<script>
  // ===== 테스트용 시뮬레이션 =====
  async function simulateDraw(count = 500) {
    const results = [];
    let executed = 0;

    function wait(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    while (executed < count && numbers.length > 0) {
      startDraw();                 // 실제 서비스 함수 호출
      executed++;

      // 애니메이션 끝날 때까지 대기 (4초 + 여유)
      await wait(4200);

      // 현재 화면 숫자 읽기
      const picked =
          digits.map(d => d.textContent).join("");

      results.push({
        order: executed,
        winner: picked
      });
    }

    console.log("시뮬레이션 결과", results);

    // 엑셀 저장
    const ws = XLSX.utils.json_to_sheet(results);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Simulation");
    XLSX.writeFile(wb, "luckydraw_real_simulation.xlsx");

    alert("시뮬레이션 완료");
  }
</script>

</body>
</html>
