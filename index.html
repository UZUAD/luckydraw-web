<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>럭키드로우 — 추첨</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --text-main: #121826;
      --box-shadow:
        0 18px 30px rgba(6, 24, 55, 0.12);
      --box-surface-top: rgba(255, 255, 255, 0.16);
      --box-surface-mid: rgba(222, 242, 255, 0.1);
      --box-surface-bottom: rgba(152, 214, 255, 0.06);
      --digit-color: rgba(241, 251, 255, 0.72);
      --digit-glow: rgba(220, 246, 255, 0.2);
      --digit-active: #116d8e;
      --digit-reveal: rgba(255, 255, 255, 0.86);
      --stage-width: min(100%, 1000px);
      --stage-height: min(100vh, 400px);
      --stage-pad-y: clamp(20px, 4vh, 28px);
      --stage-pad-x: clamp(20px, 3vw, 28px);
      --digit-width: clamp(128px, 16.8vw, 184px);
      --digit-height: clamp(156px, 24vh, 220px);
      --digit-gap: clamp(10px, 1vw, 18px);
      --digit-font-size: clamp(80px, 6.2vw, 120px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      font-family: "SUIT Variable", "Pretendard Variable", "Noto Sans KR", sans-serif;
      color: var(--text-main);
      background:
        linear-gradient(180deg, rgba(3, 24, 58, 0.42), rgba(2, 11, 30, 0.56)),
        linear-gradient(90deg, rgba(4, 38, 87, 0.32), rgba(2, 99, 117, 0.18), rgba(9, 37, 82, 0.34)),
        #04152f;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("images/logitech-workshop-wide.png") center / cover no-repeat;
      opacity: 0.92;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(124, 255, 239, 0.1), transparent 32%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(0, 0, 0, 0.18)),
        linear-gradient(90deg, rgba(1, 12, 33, 0.22), rgba(1, 12, 33, 0.08), rgba(1, 12, 33, 0.22));
      pointer-events: none;
    }

    .stage {
      position: relative;
      z-index: 1;
      width: var(--stage-width);
      min-height: var(--stage-height);
      padding: var(--stage-pad-y) var(--stage-pad-x);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .digits-wrapper {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, var(--digit-width)));
      justify-content: center;
      gap: var(--digit-gap);
      align-items: center;
    }

    .digit-box {
      position: relative;
      height: var(--digit-height);
      display: grid;
      place-items: center;
      border-radius: 30px;
      overflow: hidden;
      background-color: rgba(255, 255, 255, 0.035);
      background:
        radial-gradient(circle at top left, rgba(157, 228, 255, 0.14), transparent 42%),
        radial-gradient(circle at bottom right, rgba(76, 177, 255, 0.08), transparent 46%),
        linear-gradient(160deg, var(--box-surface-top), var(--box-surface-mid) 48%, var(--box-surface-bottom));
      border: none;
      box-shadow: var(--box-shadow);
      backdrop-filter: blur(26px) saturate(150%);
      -webkit-backdrop-filter: blur(26px) saturate(150%);
      transition:
        transform 240ms ease,
        border-color 240ms ease,
        box-shadow 240ms ease,
        background 240ms ease;
    }

    .digit-box::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 22px;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.18), transparent 46%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(205, 233, 255, 0.025) 56%, rgba(255, 255, 255, 0.01));
      box-shadow:
        inset 0 12px 24px rgba(255, 255, 255, 0.045);
      pointer-events: none;
    }

    .digit-box::after {
      content: "";
      position: absolute;
      width: 140%;
      height: 52%;
      top: -14%;
      left: -12%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), transparent);
      transform: rotate(-11deg);
      opacity: 0.12;
      pointer-events: none;
    }

    .digit-box span {
      position: relative;
      z-index: 1;
      position: absolute;
      inset: 50% auto auto 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      font-size: var(--digit-font-size);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.06em;
      text-align: center;
      transform: translate(-50%, -50%);
      color: var(--digit-color);
      text-shadow:
        0 0 22px var(--digit-glow),
        0 6px 18px rgba(212, 243, 255, 0.08);
      transition:
        transform 240ms ease,
        color 240ms ease,
        text-shadow 240ms ease;
    }

    body.is-drawing .digit-box {
      background-color: rgba(255, 255, 255, 0.035);
      background:
        radial-gradient(circle at top left, rgba(157, 228, 255, 0.14), transparent 42%),
        radial-gradient(circle at bottom right, rgba(76, 177, 255, 0.08), transparent 46%),
        linear-gradient(160deg, var(--box-surface-top), var(--box-surface-mid) 48%, var(--box-surface-bottom));
      box-shadow: var(--box-shadow);
    }

    body.is-drawing .digit-box span {
      color: var(--digit-color);
    }

    .digit-box.reveal {
      background-color: rgba(239, 247, 255, 0.06);
      background:
        radial-gradient(circle at top left, rgba(174, 231, 255, 0.16), transparent 42%),
        radial-gradient(circle at bottom right, rgba(84, 181, 255, 0.1), transparent 44%),
        linear-gradient(160deg, rgba(255, 255, 255, 0.18), rgba(232, 245, 255, 0.1) 52%, rgba(190, 226, 255, 0.06));
      box-shadow:
        0 20px 32px rgba(9, 34, 75, 0.12),
        0 0 20px rgba(136, 211, 255, 0.08);
    }

    .digit-box.reveal span {
      color: var(--digit-reveal);
      transform: scale(1.01);
      text-shadow:
        0 0 24px rgba(220, 246, 255, 0.22),
        0 6px 18px rgba(212, 243, 255, 0.08);
    }

    @media (max-width: 820px) {
      .stage {
        --digit-width: 106px;
        --digit-height: 148px;
        --digit-gap: 10px;
        --digit-font-size: 92px;
        min-height: auto;
        padding: 18px 16px;
      }

      .digit-box {
        border-radius: 22px;
      }
    }

    @media (max-width: 640px) {
      .stage {
        --digit-gap: 8px;
      }

      .digits-wrapper {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .digit-box {
        height: 106px;
        border-radius: 16px;
      }

      .digit-box::before {
        inset: 6px;
        border-radius: 12px;
      }

      .digit-box span {
        font-size: 54px;
      }
    }

    @media (max-height: 760px) {
      :root {
        --stage-pad-y: 14px;
        --digit-height: clamp(148px, 24vh, 176px);
        --digit-font-size: clamp(76px, 5.2vw, 112px);
      }

      .digit-box {
        border-radius: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="digits-wrapper" aria-label="추첨 번호">
      <div class="digit-box" id="d1"><span>0</span></div>
      <div class="digit-box" id="d2"><span>0</span></div>
      <div class="digit-box" id="d3"><span>0</span></div>
      <div class="digit-box" id="d4"><span>0</span></div>
      <div class="digit-box" id="d5"><span>0</span></div>
    </div>
  </div>

  <script>
    const digitBoxes = [
      document.getElementById("d1"),
      document.getElementById("d2"),
      document.getElementById("d3"),
      document.getElementById("d4"),
      document.getElementById("d5")
    ];

    const digits = digitBoxes.map((box) => box.querySelector("span"));
    let numbers = JSON.parse(localStorage.getItem("luckydraw_numbers") || "[]");
    if (numbers.length === 0) {
      alert("업로드된 참가자 데이터가 없습니다.\n업로드 페이지로 이동합니다.");
      location.href = "upload.html";
    }

    function randomDigit() {
      return Math.floor(Math.random() * 10);
    }

    function playConfetti() {
      if (typeof confetti !== "function") return;

      const defaults = { particleCount: 44, spread: 72, startVelocity: 28 };
      confetti({ ...defaults, origin: { x: 0.18, y: 0.14 } });
      confetti({ ...defaults, origin: { x: 0.5, y: 0.12 } });
      confetti({ ...defaults, origin: { x: 0.82, y: 0.14 } });
    }

    function clearRevealState() {
      digitBoxes.forEach((box) => box.classList.remove("reveal"));
    }

    function revealTarget(target) {
      [...target].forEach((n, i) => {
        setTimeout(() => {
          digits[i].textContent = n;
          digitBoxes[i].classList.add("reveal");
        }, i * 120);
      });
    }

    let isPlaying = false;

    function startDraw() {
      if (isPlaying || numbers.length === 0) return;

      isPlaying = true;
      clearRevealState();
      document.body.classList.add("is-drawing");

      const index = Math.floor(Math.random() * numbers.length);
      const target = numbers[index];

      const spin = setInterval(() => {
        digits.forEach((digit) => {
          digit.textContent = randomDigit();
        });
      }, 72);

      setTimeout(() => {
        clearInterval(spin);
        revealTarget(target);

        numbers.splice(index, 1);
        localStorage.setItem("luckydraw_numbers", JSON.stringify(numbers));

        setTimeout(() => {
          playConfetti();
          document.body.classList.remove("is-drawing");
          isPlaying = false;
        }, 860);
      }, 3600);
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") startDraw();
    });
  </script>

  <script>
    // 테스트용 시뮬레이션(현재 사용 x)
    async function simulateDraw(count = 500) {
      const results = [];
      let executed = 0;

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      while (executed < count && numbers.length > 0) {
        startDraw();
        executed++;

        await wait(4700);

        const picked = digits.map((digit) => digit.textContent).join("");
        results.push({
          order: executed,
          winner: picked
        });
      }

      console.log("시뮬레이션 결과", results);

      const ws = XLSX.utils.json_to_sheet(results);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Simulation");
      XLSX.writeFile(wb, "luckydraw_real_simulation.xlsx");

      alert("시뮬레이션 완료");
    }
  </script>
</body>
</html>
