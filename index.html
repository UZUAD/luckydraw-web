<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>럭키드로우 — 추첨</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --text-main: #121826;
      --panel-shadow:
        0 0 0 1px rgba(105, 179, 255, 0.06),
        0 28px 56px rgba(1, 8, 29, 0.62),
        0 0 40px rgba(65, 143, 255, 0.12);
      --digit-shadow:
        inset 0 1px 0 rgba(184, 223, 255, 0.06),
        inset 0 -10px 20px rgba(0, 0, 0, 0.34),
        0 10px 20px rgba(0, 0, 0, 0.35);
      --digit-color: #6ff7ff;
      --digit-glow: rgba(75, 247, 255, 0.62);
      --digit-reveal: #bffcff;
      --stage-width: min(100%, 1400px);
      --stage-height: 100vh;
      --stage-pad-y: clamp(20px, 4vh, 28px);
      --stage-pad-x: clamp(20px, 3vw, 28px);
      --panel-bottom-offset: 376px;
      --digit-width: clamp(172px, 8vw, 198px);
      --digit-height: clamp(156px, 25vh, 178px);
      --digit-gap: clamp(14px, 0.95vw, 18px);
      --digit-font-size: clamp(102px, 5.4vw, 122px);
      --digit-scale-x: 1.1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      font-family: "SUIT Variable", "Pretendard Variable", "Noto Sans KR", sans-serif;
      color: var(--text-main);
      background:
        linear-gradient(180deg, rgba(3, 24, 58, 0.42), rgba(2, 11, 30, 0.56)),
        linear-gradient(90deg, rgba(4, 38, 87, 0.32), rgba(2, 99, 117, 0.18), rgba(9, 37, 82, 0.34)),
        #04152f;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("images/logitech-workshop-wide.png") center / cover no-repeat;
      opacity: 0.92;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(124, 255, 239, 0.1), transparent 32%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(0, 0, 0, 0.18)),
        linear-gradient(90deg, rgba(1, 12, 33, 0.22), rgba(1, 12, 33, 0.08), rgba(1, 12, 33, 0.22));
      pointer-events: none;
    }

    .stage {
      position: relative;
      z-index: 1;
      width: var(--stage-width);
      min-height: var(--stage-height);
      padding: var(--stage-pad-y) var(--stage-pad-x);
    }

    .digits-wrapper {
      position: absolute;
      left: 50%;
      bottom: var(--panel-bottom-offset);
      display: grid;
      grid-template-columns: repeat(5, minmax(0, var(--digit-width)));
      gap: var(--digit-gap);
      align-items: center;
      padding: 18px 22px;
      border-radius: 32px;
      background:
        radial-gradient(circle at center, rgba(65, 214, 255, 0.05), transparent 62%),
        linear-gradient(180deg, rgba(13, 18, 31, 0.5), rgba(7, 10, 18, 0.36));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.018),
        0 22px 48px rgba(0, 0, 0, 0.18),
        0 0 26px rgba(31, 105, 255, 0.05);
      transform: translateX(-50%);
      isolation: isolate;
    }

    .digits-wrapper::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 36px;
      background:
        radial-gradient(circle at center, rgba(50, 168, 255, 0.08), transparent 66%),
        radial-gradient(circle at 15% 50%, rgba(64, 218, 255, 0.05), transparent 34%),
        radial-gradient(circle at 85% 50%, rgba(64, 114, 255, 0.05), transparent 34%);
      filter: blur(18px);
      z-index: -1;
      pointer-events: none;
    }

    .digits-wrapper::after {
      content: "";
      position: absolute;
      top: 50%;
      left: calc(100% + 14px);
      width: 94px;
      height: 94px;
      transform: translateY(-50%);
      background:
        radial-gradient(circle, rgba(143, 198, 255, 0.78) 0 1.5px, transparent 2px) 0 50% / 12px 12px repeat-x,
        radial-gradient(circle, rgba(143, 198, 255, 0.45) 0 1.4px, transparent 2px) 50% 0 / 12px 12px repeat-y;
      opacity: 0.52;
      pointer-events: none;
    }

    .digit-box {
      position: relative;
      height: var(--digit-height);
      display: grid;
      place-items: center;
      border-radius: 20px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 18%, rgba(98, 152, 234, 0.085), transparent 42%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.018), rgba(255, 255, 255, 0) 18%),
        linear-gradient(180deg, rgba(14, 20, 34, 0.94), rgba(7, 10, 18, 0.98));
      border: 1px solid rgba(154, 210, 255, 0.02);
      box-shadow:
        inset 0 1px 0 rgba(235, 246, 255, 0.018),
        inset 0 -14px 24px rgba(0, 0, 0, 0.18),
        0 10px 22px rgba(0, 0, 0, 0.14),
        0 0 22px rgba(42, 131, 255, 0.035);
      transition:
        transform 240ms ease,
        border-color 240ms ease,
        box-shadow 240ms ease,
        background 240ms ease;
    }

    .digit-box::before {
      content: "";
      position: absolute;
      inset: 9px;
      border-radius: 16px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.014) 14%, rgba(255, 255, 255, 0) 32%),
        radial-gradient(circle at 50% 0%, rgba(154, 203, 255, 0.065), transparent 52%),
        linear-gradient(180deg, rgba(102, 160, 255, 0.018), rgba(4, 10, 24, 0.006)),
        linear-gradient(180deg, rgba(4, 12, 30, 0.06), rgba(0, 0, 0, 0));
      box-shadow:
        inset 0 0 0 1px rgba(236, 245, 255, 0.06),
        inset 0 0 0 2px rgba(111, 164, 236, 0.022),
        inset 0 8px 18px rgba(121, 205, 255, 0.01);
      pointer-events: none;
    }

    .digit-box::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, rgba(56, 237, 255, 0.04), transparent 58%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent 18%),
        linear-gradient(180deg, rgba(146, 218, 255, 0.028), transparent 28%);
      opacity: 0.58;
      pointer-events: none;
    }

    .digit-box span {
      position: relative;
      z-index: 1;
      position: absolute;
      inset: 50% auto auto 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      font-size: var(--digit-font-size);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.01em;
      text-align: center;
      transform: translate(-50%, -50%) scaleX(var(--digit-scale-x));
      color: var(--digit-color);
      text-shadow:
        0 0 12px rgba(65, 247, 255, 0.86),
        0 0 24px var(--digit-glow),
        0 0 36px rgba(46, 166, 255, 0.22);
      transition:
        transform 240ms ease,
        color 240ms ease,
        text-shadow 240ms ease;
    }

    body.is-drawing .digit-box {
      background:
        radial-gradient(circle at 50% 20%, rgba(82, 150, 255, 0.14), transparent 42%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.028), rgba(255, 255, 255, 0) 20%),
        linear-gradient(180deg, rgba(17, 23, 36, 0.94), rgba(8, 13, 23, 0.98));
      border-color: rgba(190, 231, 255, 0.045);
      box-shadow:
        inset 0 1px 0 rgba(230, 242, 255, 0.03),
        inset 0 -10px 20px rgba(0, 0, 0, 0.22),
        0 0 28px rgba(38, 182, 255, 0.09),
        0 10px 20px rgba(0, 0, 0, 0.22);
    }

    body.is-drawing .digit-box span {
      color: #8efcff;
      text-shadow:
        0 0 14px rgba(94, 255, 255, 0.92),
        0 0 26px rgba(74, 221, 255, 0.72),
        0 0 42px rgba(47, 142, 255, 0.28);
    }

    .digit-box.reveal {
      background:
        radial-gradient(circle at 50% 18%, rgba(86, 177, 255, 0.16), transparent 40%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.032), rgba(255, 255, 255, 0) 20%),
        linear-gradient(180deg, rgba(17, 29, 43, 0.95), rgba(8, 14, 24, 0.98));
      border-color: rgba(205, 241, 255, 0.05);
      box-shadow:
        inset 0 1px 0 rgba(226, 247, 255, 0.04),
        inset 0 -10px 20px rgba(0, 0, 0, 0.16),
        0 0 34px rgba(62, 224, 255, 0.12),
        0 14px 24px rgba(0, 0, 0, 0.2);
    }

    .digit-box.reveal span {
      color: var(--digit-reveal);
      transform: translate(-50%, -50%) scale(1.01) scaleX(var(--digit-scale-x));
      text-shadow:
        0 0 16px rgba(140, 255, 255, 0.95),
        0 0 30px rgba(90, 238, 255, 0.76),
        0 0 48px rgba(44, 151, 255, 0.36);
    }

    @media (max-width: 820px) {
      .stage {
        --digit-width: 138px;
        --digit-height: 150px;
        --digit-gap: 12px;
        --digit-font-size: 96px;
        min-height: auto;
        padding: 18px 16px;
      }

      .digit-box {
        border-radius: 18px;
      }
    }

    @media (max-width: 640px) {
      .stage {
        --digit-gap: 8px;
      }

      .digits-wrapper {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        padding: 10px;
      }

      .digit-box {
        height: 126px;
        border-radius: 18px;
      }

      .digit-box::before {
        inset: 8px;
        border-radius: 14px;
      }

      .digit-box span {
        font-size: 54px;
      }
    }

    @media (max-height: 760px) {
      :root {
        --stage-pad-y: 14px;
        --digit-height: clamp(148px, 24vh, 176px);
        --digit-font-size: clamp(76px, 5.2vw, 112px);
      }

      .digit-box {
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="digits-wrapper" aria-label="추첨 번호">
      <div class="digit-box" id="d1"><span>0</span></div>
      <div class="digit-box" id="d2"><span>0</span></div>
      <div class="digit-box" id="d3"><span>0</span></div>
      <div class="digit-box" id="d4"><span>0</span></div>
      <div class="digit-box" id="d5"><span>0</span></div>
    </div>
  </div>

  <script>
    const digitBoxes = [
      document.getElementById("d1"),
      document.getElementById("d2"),
      document.getElementById("d3"),
      document.getElementById("d4"),
      document.getElementById("d5")
    ];

    const digits = digitBoxes.map((box) => box.querySelector("span"));
    let numbers = JSON.parse(localStorage.getItem("luckydraw_numbers") || "[]");
    if (numbers.length === 0) {
      alert("업로드된 참가자 데이터가 없습니다.\n업로드 페이지로 이동합니다.");
      location.href = "upload.html";
    }

    function randomDigit() {
      return Math.floor(Math.random() * 10);
    }

    function playConfetti() {
      if (typeof confetti !== "function") return;

      const defaults = { particleCount: 44, spread: 72, startVelocity: 28 };
      confetti({ ...defaults, origin: { x: 0.18, y: 0.14 } });
      confetti({ ...defaults, origin: { x: 0.5, y: 0.12 } });
      confetti({ ...defaults, origin: { x: 0.82, y: 0.14 } });
    }

    function clearRevealState() {
      digitBoxes.forEach((box) => box.classList.remove("reveal"));
    }

    function revealTarget(target) {
      [...target].forEach((n, i) => {
        setTimeout(() => {
          digits[i].textContent = n;
          digitBoxes[i].classList.add("reveal");
        }, i * 120);
      });
    }

    let isPlaying = false;

    function startDraw() {
      if (isPlaying || numbers.length === 0) return;

      isPlaying = true;
      clearRevealState();
      document.body.classList.add("is-drawing");

      const index = Math.floor(Math.random() * numbers.length);
      const target = numbers[index];

      const spin = setInterval(() => {
        digits.forEach((digit) => {
          digit.textContent = randomDigit();
        });
      }, 72);

      setTimeout(() => {
        clearInterval(spin);
        revealTarget(target);

        numbers.splice(index, 1);
        localStorage.setItem("luckydraw_numbers", JSON.stringify(numbers));

        setTimeout(() => {
          playConfetti();
          document.body.classList.remove("is-drawing");
          isPlaying = false;
        }, 860);
      }, 3600);
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") startDraw();
    });
  </script>

  <script>
    // 테스트용 시뮬레이션(현재 사용 x)
    async function simulateDraw(count = 500) {
      const results = [];
      let executed = 0;

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      while (executed < count && numbers.length > 0) {
        startDraw();
        executed++;

        await wait(4700);

        const picked = digits.map((digit) => digit.textContent).join("");
        results.push({
          order: executed,
          winner: picked
        });
      }

      console.log("시뮬레이션 결과", results);

      const ws = XLSX.utils.json_to_sheet(results);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Simulation");
      XLSX.writeFile(wb, "luckydraw_real_simulation.xlsx");

      alert("시뮬레이션 완료");
    }
  </script>
</body>
</html>
